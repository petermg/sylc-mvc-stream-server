name: Server bug report
description: Report a reproducible SyLC MVC Stream Server problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping test the public alpha. Do not attach copyrighted media.
  - type: input
    id: version
    attributes:
      label: Server version
      placeholder: 0.7.0-alpha.2
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and hardware
      placeholder: Ubuntu 24.04, Intel UHD 630, VA-API
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source type
      options: [MVC MKV/MK3D, Unencrypted Blu-ray 3D ISO, Other]
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Output mode and audio track
      placeholder: passive-rows-left-top, audio track 0
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: SyLC report and relevant journal output
      description: Remove private paths, addresses, tokens, and media names when necessary.
    validations:
      required: true
